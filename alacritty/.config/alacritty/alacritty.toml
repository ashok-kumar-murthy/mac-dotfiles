general.import = ["~/.cache/modus-theme/alacritty.toml"]

[window]
dimensions = { columns = 120, lines = 34 }
padding = { x = 12, y = 10 }
dynamic_padding = true
decorations = "Buttonless"
dynamic_title = true
opacity = 1
blur = false
option_as_alt = "Both"

[scrolling]
history = 100000
multiplier = 3

[font]
size = 15.0
builtin_box_drawing = true

[font.normal]
family = "IoskeleyMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "IoskeleyMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "IoskeleyMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "IoskeleyMono Nerd Font Mono"
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = false

[mouse]
hide_when_typing = true

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "OnlyCopy"

[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u001B[H"

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u001B[F"

[[keyboard.bindings]]
key = "Left"
mods = "Option"
chars = "\u001Bb"

[[keyboard.bindings]]
key = "Right"
mods = "Option"
chars = "\u001Bf"

[[keyboard.bindings]]
key = "Back"
mods = "Command"
chars = "\u0015"

[[keyboard.bindings]]
key = "Back"
mods = "Option"
chars = "\u001B\u007F"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
