# A window-focused tmux setup with Modus Operandi styling.

# Keep the familiar Ctrl-b prefix; Meta bindings below work without a prefix.
set -g prefix C-b
bind C-b send-prefix

# Modern terminal capabilities and responsive behavior.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
set -g aggressive-resize on
set -sg escape-time 10
set -g history-limit 100000
set -g renumber-windows on
set -g detach-on-destroy off
set -g mouse on
setw -g automatic-rename on
set -g allow-rename off

# Integration with Alacritty and the macOS clipboard. `set-clipboard` enables
# OSC 52, while the copy-mode binding also writes directly through pbcopy.
set -s set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi

# This is intentionally a window-only workflow: remove tmux's split shortcuts.
unbind '"'
unbind %

# Meta-n opens a new window; Meta-h/l cycle through windows.
bind -n M-n new-window
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-s copy-mode

# Easy fallback window controls with the prefix.
bind c new-window
bind n next-window
bind p previous-window

# In copy mode, use vi motions: v starts a visible selection, then y/Enter
# copies it into the system clipboard. Meta-s opens copy mode without a prefix.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
# Start the selection and change it to rectangular in one keystroke.
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Modus theme status line. The switcher maintains this generated include.
set -g status-position bottom
set -g status-interval 5
source-file -q "#{HOME}/.cache/modus-theme/tmux.conf"
set -g status-left-length 30
set -g status-right ""
set -g status-right-length 0
setw -g window-status-separator ""
set -g display-panes-colour "#00538b"
set -g display-panes-active-colour "#6f5300"

# Start numbering at 1, which makes window switching easier to read.
set -g base-index 1
