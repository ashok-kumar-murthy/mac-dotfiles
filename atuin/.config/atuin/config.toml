update_check = false
auto_sync = false

search_mode = "fuzzy"
workspaces = true
filter_mode_shell_up_key_binding = "directory"
search_mode_shell_up_key_binding = "prefix"

style = "compact"
inline_height = 24
show_preview = true
max_preview_height = 4
show_help = false
show_tabs = false
show_numeric_shortcuts = false

enter_accept = true
command_chaining = true
keymap_mode = "vim-insert"
keymap_cursor = { vim_insert = "steady-bar", vim_normal = "steady-block" }

[search]
filters = ["workspace", "directory", "global"]

[tmux]
enabled = true
width = "90%"
height = "70%"

[theme]
name = "modus-operandi"

[ui]
columns = [
  "time",
  { type = "directory", width = 28 },
  "command",
]
